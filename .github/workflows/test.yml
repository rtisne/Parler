name: "test"
on: [pull_request]

jobs:
  rust-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: windows-latest-tests

      - name: Setup OpenBLAS (Windows x64)
        shell: pwsh
        run: ./.github/scripts/setup-openblas.ps1 -Target "x86_64-pc-windows-msvc"

      - name: Install pkg-config (Windows x64)
        shell: pwsh
        run: ./.github/scripts/setup-pkgconf.ps1 -Target "x86_64-pc-windows-msvc"

      - name: Use mock TranscriptionManager (CI only)
        shell: bash
        working-directory: src-tauri
        run: |
          # Swap to mock adapter - avoids compiling whisper/Vulkan
          cp src/managers/transcription_mock.rs src/managers/transcription.rs
          sed -i '/^transcribe-rs/d' Cargo.toml

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

  powershell-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = ".github/scripts"
          $config.Run.Exit = $true
          $config.Output.Verbosity = "Detailed"
          Invoke-Pester -Configuration $config
