name: "Build"

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      build-args:
        required: false
        type: string
        default: ""
      release-id:
        required: false
        type: string
      asset-prefix:
        required: false
        type: string
        default: "parler"
      asset-name-pattern:
        required: false
        type: string
        default: ""
      upload-artifacts:
        required: false
        type: boolean
        default: false
      sign-binaries:
        required: false
        type: boolean
        default: false
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
        default: ${{ github.ref }}
      is-debug-build:
        required: false
        type: boolean
        default: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ inputs.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine build profile
        id: build-profile
        shell: bash
        run: |
          if [[ "${{ inputs.is-debug-build }}" == "true" ]]; then
            echo "profile=debug" >> "$GITHUB_OUTPUT"
            echo "Build profile: debug"
          else
            echo "profile=release" >> "$GITHUB_OUTPUT"
            echo "Build profile: release"
          fi

      - name: Setup Bun (standard)
        if: ${{ !contains(inputs.target, 'aarch64') }}
        uses: oven-sh/setup-bun@v2

      # Native Windows ARM64 builds are available since Bun 1.3.10.
      - name: Setup Bun (Windows ARM64)
        if: ${{ contains(inputs.target, 'aarch64') }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: "https://github.com/oven-sh/bun/releases/latest/download/bun-windows-aarch64.zip"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ inputs.platform }}-${{ inputs.target }}

      - name: Setup OpenBLAS (Windows)
        shell: pwsh
        run: ./.github/scripts/setup-openblas.ps1 -Target "${{ inputs.target }}"

      - name: Install pkg-config (Windows)
        shell: pwsh
        run: ./.github/scripts/setup-pkgconf.ps1 -Target "${{ inputs.target }}"

      - name: Install Vulkan SDK (Windows x64)
        if: ${{ !contains(inputs.target, 'aarch64') }}
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # humbletim/install-vulkan-sdk@v1.2 cannot target Windows ARM64 yet.
      # Download prebuilt binaries (Bin) + build headers/libs from source.
      # See https://github.com/humbletim/install-vulkan-sdk/pull/22 for prebuilt ARM64 support progress.
      - name: Prepare Vulkan SDK env (Windows ARM64)
        if: ${{ contains(inputs.target, 'aarch64') }}
        shell: pwsh
        run: |
          $sdkDir = Join-Path $env:GITHUB_WORKSPACE "VULKAN_SDK"
          New-Item -ItemType Directory -Force -Path $sdkDir | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_SDK=$sdkDir"

      - name: Download Vulkan SDK binaries (Windows ARM64)
        if: ${{ contains(inputs.target, 'aarch64') }}
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/1.4.309.0/warm/InstallVulkanARM64-1.4.309.0.exe"
          $outFile = "vulkan_sdk_arm.exe"
          Write-Host "Downloading Vulkan SDK binaries from $url"
          Invoke-WebRequest -Uri $url -OutFile $outFile

      - name: Extract Vulkan SDK binaries (Windows ARM64)
        if: ${{ contains(inputs.target, 'aarch64') }}
        shell: pwsh
        run: |
          $sdkDir = $env:VULKAN_SDK
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          Write-Host "Extracting binaries to $sdkDir"
          & $sevenZip x "./vulkan_sdk_arm.exe" "-o$sdkDir" -aoa
          $binPath = Join-Path $sdkDir "Bin"
          Add-Content -Path $env:GITHUB_PATH -Value $binPath
          Write-Host "Verifying glslc..."
          & (Join-Path $binPath "glslc.exe") --version

      - name: Build Vulkan SDK headers and libs (Windows ARM64)
        if: ${{ contains(inputs.target, 'aarch64') }}
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.309.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Check signing secrets availability
        id: signing-check
        shell: bash
        run: |
          if [[ -n "$AZURE_ID" ]]; then
            echo "has-azure-signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-azure-signing=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Azure signing credentials not configured"
          fi
          if [[ -n "$SIGNING_KEY" ]]; then
            echo "has-signing-key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-signing-key=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Tauri updater signing key not configured"
          fi
        env:
          AZURE_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Install trusted-signing-cli
        if: inputs.sign-binaries && steps.signing-check.outputs.has-azure-signing == 'true'
        run: cargo install trusted-signing-cli

      - name: Configure Windows code signing
        if: inputs.sign-binaries && steps.signing-check.outputs.has-azure-signing == 'true'
        shell: bash
        env:
          SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          SIGNING_CERTIFICATE: ${{ secrets.AZURE_SIGNING_CERTIFICATE }}
        run: |
          # Resolve the full path to trusted-signing-cli to avoid PATH issues during Tauri bundling
          TSC_PATH=$(which trusted-signing-cli || command -v trusted-signing-cli)
          if [ -z "$TSC_PATH" ]; then
            echo "::error::trusted-signing-cli not found in PATH after installation"
            exit 1
          fi
          echo "trusted-signing-cli found at: $TSC_PATH"

          # Use secrets if available, otherwise fall back to upstream defaults
          ENDPOINT="${SIGNING_ENDPOINT:-https://eus.codesigning.azure.net/}"
          ACCOUNT="${SIGNING_ACCOUNT:-CJ-Signing}"
          CERTIFICATE="${SIGNING_CERTIFICATE:-cjpais-dev}"

          # Inject signCommand with full path into tauri.conf.json
          SIGN_CMD="$TSC_PATH -e $ENDPOINT -a $ACCOUNT -c $CERTIFICATE -d Parler %1"
          export SIGN_CMD
          node -e 'var fs=require("fs"),c=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json","utf8"));if(!c.bundle)c.bundle={};if(!c.bundle.windows)c.bundle.windows={};c.bundle.windows.signCommand=process.env.SIGN_CMD;fs.writeFileSync("src-tauri/tauri.conf.json",JSON.stringify(c,null,2)+"\n");console.log("signCommand configured:",c.bundle.windows.signCommand);'

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: rustup install target
        if: ${{ inputs.target != '' }}
        run: rustup target add ${{ inputs.target }}

      - name: Patch asset name pattern
        id: patch-release-name
        shell: bash
        if: ${{ inputs.release-id != '' && inputs.asset-name-pattern != '' }}
        run: |
          platform="${{ inputs.platform }}"
          replacement="$(echo ${platform} | sed -E 's/-latest//')"
          patched_platform=$(echo '${{ inputs.asset-name-pattern }}' | sed -E "s/\[platform\]/${replacement}/")
          if [[ -n "${{ inputs.asset-prefix }}" ]]; then
            patched_platform="${{ inputs.asset-prefix }}_${patched_platform}"
          fi
          echo "platform=${patched_platform}" >> $GITHUB_OUTPUT

      - name: Configure updater signing
        if: inputs.sign-binaries && steps.signing-check.outputs.has-signing-key == 'true'
        shell: bash
        run: |
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<TAURI_KEY_DELIMITER"
            echo "$SIGNING_KEY"
            echo "TAURI_KEY_DELIMITER"
          } >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
          echo "✅ Updater signing key configured"
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Disable updater artifacts signing (unsigned build)
        if: ${{ !inputs.sign-binaries || steps.signing-check.outputs.has-signing-key != 'true' }}
        shell: bash
        run: |
          echo "⚠️ Disabling updater artifacts and removing updater plugin configuration (no signing key available)"
          echo "PARLER_UPDATER_ENABLED=false" >> "$GITHUB_ENV"
          node -e 'var fs=require("fs"),c=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json","utf8"));if(!c.bundle)c.bundle={};c.bundle.createUpdaterArtifacts=false;if(c.plugins)delete c.plugins.updater;fs.writeFileSync("src-tauri/tauri.conf.json",JSON.stringify(c,null,2)+"\n");console.log("createUpdaterArtifacts disabled, updater plugin configuration removed");'

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_CLIENT_ID: ${{ inputs.sign-binaries && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ inputs.sign-binaries && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ inputs.sign-binaries && secrets.AZURE_TENANT_ID || '' }}
        with:
          tagName: ${{ inputs.release-id && format('v{0}', steps.get-version.outputs.version) || '' }}
          releaseName: ${{ inputs.release-id && format('v{0}', steps.get-version.outputs.version) || '' }}
          releaseId: ${{ inputs.release-id }}
          assetNamePattern: ${{ steps.patch-release-name.outputs.platform }}
          args: ${{ inputs.build-args }}

      - name: Smoke test Windows application startup
        shell: pwsh
        run: |
          ./.github/scripts/smoke-test-windows-startup.ps1 `
            -BinaryPath "${{ contains(inputs.build-args, '--target') && format('src-tauri/target/{0}/{1}/parler.exe', inputs.target, steps.build-profile.outputs.profile) || format('src-tauri/target/{0}/parler.exe', steps.build-profile.outputs.profile) }}"

      - name: Verify staged OpenBLAS runtime (Windows)
        shell: pwsh
        run: |
          $required = @("src-tauri/openblas-libs/libopenblas.dll")
          if ("${{ inputs.target }}" -eq "aarch64-pc-windows-msvc") {
            $required += "src-tauri/openblas-libs/openblas.dll"
          }
          foreach ($file in $required) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Required staged OpenBLAS runtime is missing: $file"
            }
            $size = (Get-Item $file).Length
            if ($size -eq 0) {
              throw "Staged OpenBLAS runtime is empty: $file"
            }
            Write-Host "$file $size bytes"
          }

      - name: Installer lifecycle test (MSI)
        shell: pwsh
        run: |
          ./.github/scripts/installer-lifecycle.ps1 `
            -InstallerType msi `
            -BundleDir "${{ inputs.target != '' && inputs.target != 'x86_64-pc-windows-msvc' && format('src-tauri/target/{0}/{1}/bundle', inputs.target, steps.build-profile.outputs.profile) || format('src-tauri/target/{0}/bundle', steps.build-profile.outputs.profile) }}"

      - name: Installer lifecycle test (NSIS)
        shell: pwsh
        run: |
          ./.github/scripts/installer-lifecycle.ps1 `
            -InstallerType nsis `
            -BundleDir "${{ inputs.target != '' && inputs.target != 'x86_64-pc-windows-msvc' && format('src-tauri/target/{0}/{1}/bundle', inputs.target, steps.build-profile.outputs.profile) || format('src-tauri/target/{0}/bundle', steps.build-profile.outputs.profile) }}"

      - name: Upload installer lifecycle diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-lifecycle-logs-${{ inputs.target }}
          path: ${{ runner.temp }}/installer-lifecycle/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload artifacts (Windows)
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.asset-prefix }}-${{ inputs.target }}
          # Default Windows builds place bundles under release/, but cross-compiles (ARM64) nest under target/<triple>/release.
          path: |
            src-tauri/target/${{ inputs.target != '' && inputs.target != 'x86_64-pc-windows-msvc' && format('{0}/{1}', inputs.target, steps.build-profile.outputs.profile) || steps.build-profile.outputs.profile }}/bundle/msi/*.msi
            src-tauri/target/${{ inputs.target != '' && inputs.target != 'x86_64-pc-windows-msvc' && format('{0}/{1}', inputs.target, steps.build-profile.outputs.profile) || steps.build-profile.outputs.profile }}/bundle/nsis/*.exe
          retention-days: 30
