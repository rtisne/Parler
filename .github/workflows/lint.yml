name: "lint"
on: [pull_request]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test translation baseline validator
        run: bun run test:translations

      - name: Test packaged build configuration
        run: bun run test:build-config

      - name: Test Windows-only CI structure
        run: bun run test:ci-structure

      - name: Check translation consistency
        run: bun run check:translations

      - name: Run ESLint
        run: bun run lint

      - name: Run actionlint
        shell: pwsh
        run: |
          $version = "1.7.7"
          $zip = Join-Path $env:RUNNER_TEMP "actionlint.zip"
          Invoke-WebRequest -Uri "https://github.com/rhysd/actionlint/releases/download/v$version/actionlint_${version}_windows_amd64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "actionlint")
          & (Join-Path $env:RUNNER_TEMP "actionlint/actionlint.exe") -color
          if ($LASTEXITCODE -ne 0) { throw "actionlint reported errors" }
